[workspace]
resolver = "3"
members = [
    "crates/xeflash-core",
    "crates/xeflash-runtime",
    "crates/xeflash-quant",
    "crates/xeflash-model",
    "tools/benchmark",
    "tools/convert",
    "tools/validation",
    "tools/run",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"

[workspace.dependencies]
xeflash-core = { path = "crates/xeflash-core" }
xeflash-runtime = { path = "crates/xeflash-runtime" }
xeflash-quant = { path = "crates/xeflash-quant" }
xeflash-model = { path = "crates/xeflash-model" }

[profile.release]
opt-level = 3
debug = 1
